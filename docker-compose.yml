name: turbo

services:
  frankenphp:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      HTTP_HOST: frankenphp.turbo.orb.local
      KIRBY_HOST: frankenphp.turbo.orb.local
      SERVER_NAME: frankenphp.turbo.orb.local
      XDEBUG_MODE: off
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$h = @get_headers(\"http://127.0.0.1/\"); exit(str_contains($$h[0] ?? \"\", \"200\") ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - .:/app
      - composer_vendor:/app/vendor
      - kirby_core:/app/tests/kirby
      - frankenphp_data:/data
      - frankenphp_config:/config
    command:
      - sh
      - -lc
      - |
        if [ ! -f vendor/autoload.php ] || [ ! -f tests/kirby/bootstrap.php ]; then
          composer install --no-interaction --optimize-autoloader
        fi
        sed -i 's/function dump(/function xdump(/g' tests/kirby/config/helpers.php
        sed -i 's/function e(/function xe(/g' tests/kirby/config/helpers.php
        exec frankenphp php-server --root /app/tests/public --listen :80 --access-log

  redis:
    image: redis:7.4-bookworm
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
    ports:
      - "127.0.0.1:63790:6379"
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  composer_vendor:
  kirby_core:
  frankenphp_data:
  frankenphp_config:
  redis_data:
